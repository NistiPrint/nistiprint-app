name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: nistiprint_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nistiprint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e packages/shared -r apps/api/requirements.txt -r apps/worker/requirements.txt -r apps/local_agent/requirements.txt
      - name: Run operational integrity suites
        env:
          NISTIPRINT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nistiprint_test
        run: python scripts/test_integridade.py
      - name: Compile Python packages
        run: python -m compileall -q packages/shared/nistiprint_shared apps/api/routes apps/worker apps/local_agent
      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Test frontend units
        working-directory: apps/frontend
        run: npm run test:unit
      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          # Invocado via `bash` de proposito: assim o deploy nao depende do bit
          # de execucao do arquivo, que se perde ao editar pelo Windows e some
          # de novo a cada `git reset --hard` se o modo nao estiver no indice.
          script: bash /opt/nistiprint/deploy.sh
