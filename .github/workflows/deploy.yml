name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/local_agent/**'
      - 'docs/'
      - 'kb/'
      - 'scripts/'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          # Invocado via `bash` de proposito: assim o deploy nao depende do bit
          # de execucao do arquivo, que se perde ao editar pelo Windows e some
          # de novo a cada `git reset --hard` se o modo nao estiver no indice.
          script: bash /opt/nistiprint/deploy.sh