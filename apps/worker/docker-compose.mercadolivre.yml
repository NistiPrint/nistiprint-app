services:
  mercadolivre-personalization-accounts:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    command:
      - python
      - -m
      - nistiprint_shared.services.mercadolivre_personalization_worker
      - accounts
    restart: unless-stopped
    env_file:
      - path: .env.mercadolivre.accounts
        required: false
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?Set SUPABASE_SERVICE_KEY}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis-celery:6379/0}
      MERCADOLIVRE_CHAT_RECONCILE_SECONDS: ${MERCADOLIVRE_CHAT_RECONCILE_SECONDS:-120}
      TZ: America/Sao_Paulo
    networks:
      - nistiprint-shared

networks:
  nistiprint-shared:
    external: true
    name: nistiprint-shared
